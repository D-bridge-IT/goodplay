<body>
<div class="phone" id="phone">
  <header class="topbar" id="topbar"></header>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/i18n.js?v=4"></script>
<script src="js/state.js?v=4"></script>
<script src="js/ui.js?v=4"></script>

<script src="js/main.js?v=4"></script>
<script type="module">
  // Motion (Framer Motion for the DOM) for hub animations; the app works without it.
  try {
    const m = await import('https://cdn.jsdelivr.net/npm/motion@11.11.17/+esm');
    window.__motion = { animate: m.animate, stagger: m.stagger };
    document.dispatchEvent(new Event('motion-ready'));
  } catch (e) { /* offline: CSS fallbacks are used */ }
</script>
</body>
</html>
